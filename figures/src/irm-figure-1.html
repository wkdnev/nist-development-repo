<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#fff;font-family:Segoe UI,Arial,sans-serif}</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="828" viewBox="0 0 1520 828" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0L10,5L0,10z" fill="#999"/></marker><marker id="b" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0L0,5L10,10z" fill="#999"/></marker></defs>
<rect width="1520" height="828" fill="#fff"/>
<text x="48" y="55" font-size="30" font-weight="700" fill="#1a1a1a">Every incident follows the same steps</text>
<text x="48" y="92" font-size="21" fill="#555">Greater severity means more people and faster targets, not a different process.</text>
<rect x="48" y="140" width="432" height="196" rx="12" fill="#fff" stroke="#2f6fd6" stroke-width="3"/>
<text x="76" y="188" font-size="25" font-weight="700" fill="#1a1a1a">1 Report</text>
<text x="76" y="226" font-size="20" fill="#555">anyone, to the security officer,</text>
<text x="76" y="256" font-size="20" fill="#555">within 1 hour</text>
<rect x="544" y="140" width="432" height="196" rx="12" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="572" y="188" font-size="25" font-weight="700" fill="#1a1a1a">2 Detect and analyse</text>
<text x="572" y="226" font-size="20" fill="#555">confirm it, set the severity,</text>
<text x="572" y="256" font-size="20" fill="#555">open the record</text>
<rect x="1040" y="140" width="432" height="196" rx="12" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="1068" y="188" font-size="25" font-weight="700" fill="#1a1a1a">3 Contain</text>
<text x="1068" y="226" font-size="20" fill="#555">preserve the evidence first,</text>
<text x="1068" y="256" font-size="20" fill="#555">then limit the harm</text>
<rect x="1040" y="420" width="432" height="196" rx="12" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="1068" y="468" font-size="25" font-weight="700" fill="#1a1a1a">4 Eradicate</text>
<text x="1068" y="506" font-size="20" fill="#555">remove the cause: fix the flaw,</text>
<text x="1068" y="536" font-size="20" fill="#555">change the secrets</text>
<rect x="544" y="420" width="432" height="196" rx="12" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="572" y="468" font-size="25" font-weight="700" fill="#1a1a1a">5 Recover</text>
<text x="572" y="506" font-size="20" fill="#555">restore normal service, with</text>
<text x="572" y="536" font-size="20" fill="#555">the contingency plan if needed</text>
<rect x="48" y="420" width="432" height="196" rx="12" fill="#fff" stroke="#2e9e44" stroke-width="3"/>
<text x="76" y="468" font-size="25" font-weight="700" fill="#1a1a1a">6 Close and learn</text>
<text x="76" y="506" font-size="20" fill="#555">within 10 working days: root</text>
<text x="76" y="536" font-size="20" fill="#555">cause, lessons, and changes</text>
<text x="76" y="566" font-size="20" fill="#555">to the plan and the controls</text>
<line x1="480" y1="238.0" x2="542" y2="238.0" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="976" y1="238.0" x2="1038" y2="238.0" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="1256.0" y1="336" x2="1256.0" y2="418" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="1040" y1="518.0" x2="978" y2="518.0" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="544" y1="518.0" x2="482" y2="518.0" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="48" y="676" width="1424" height="112" rx="12" fill="#efeeeb" stroke="#999" stroke-width="2"/>
<text x="76" y="723" font-size="20" fill="#555">If personal data may be involved, the legal adviser is told at once.</text>
<text x="76" y="755" font-size="20" fill="#555">A reportable breach goes to the ICO within 72 hours of becoming aware of it.</text>
</svg></body></html>
