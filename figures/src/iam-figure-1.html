<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#fff;font-family:Segoe UI,Arial,sans-serif}</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="794" viewBox="0 0 1520 794" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0L10,5L0,10z" fill="#999"/></marker></defs>
<rect width="1520" height="794" fill="#fff"/>
<text x="48" y="55" font-size="30" font-weight="700" fill="#1a1a1a">How a person signs in</text>
<text x="48" y="92" font-size="21" fill="#555">The design, as the system owner states it. Not yet tested or evidenced.</text>
<rect x="48" y="130" width="432" height="200" rx="12" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="76" y="176" font-size="25" font-weight="700" fill="#1a1a1a">1 Open the system</text>
<text x="76" y="214" font-size="20" fill="#555">not yet signed in, the person</text>
<text x="76" y="244" font-size="20" fill="#555">is sent to PingFederate (F6)</text>
<rect x="544" y="130" width="432" height="200" rx="12" fill="#fff" stroke="#2f6fd6" stroke-width="3"/>
<text x="572" y="176" font-size="25" font-weight="700" fill="#1a1a1a">2 PingFederate authenticates</text>
<text x="572" y="214" font-size="20" fill="#555">password and multi-factor</text>
<text x="572" y="244" font-size="20" fill="#555">authentication, on</text>
<text x="572" y="274" font-size="20" fill="#555">&lt;Organisation&gt;'s sign-in page</text>
<rect x="1040" y="130" width="432" height="200" rx="12" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="1068" y="176" font-size="25" font-weight="700" fill="#1a1a1a">3 Signed response</text>
<text x="1068" y="214" font-size="20" fill="#555">an OpenID Connect response</text>
<text x="1068" y="244" font-size="20" fill="#555">that names the person and</text>
<text x="1068" y="274" font-size="20" fill="#555">carries no groups</text>
<line x1="480" y1="230" x2="542" y2="230" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="976" y1="230" x2="1038" y2="230" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="1256" y1="330" x2="1256" y2="396" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="1040" y="400" width="432" height="200" rx="12" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="1068" y="446" font-size="25" font-weight="700" fill="#1a1a1a">4 The response is checked</text>
<text x="1068" y="484" font-size="20" fill="#555">signed by PingFederate, issued</text>
<text x="1068" y="514" font-size="20" fill="#555">for this system, in date, and</text>
<text x="1068" y="544" font-size="20" fill="#555">not used before</text>
<rect x="544" y="400" width="432" height="200" rx="12" fill="#fff" stroke="#2e9e44" stroke-width="3"/>
<text x="572" y="446" font-size="25" font-weight="700" fill="#1a1a1a">5 Groups read</text>
<text x="572" y="484" font-size="20" fill="#555">the API reads the person's AD</text>
<text x="572" y="514" font-size="20" fill="#555">groups over LDAPS (F7); they</text>
<text x="572" y="544" font-size="20" fill="#555">give roles and schema access</text>
<rect x="48" y="400" width="432" height="200" rx="12" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="76" y="446" font-size="25" font-weight="700" fill="#1a1a1a">6 How long it lasts</text>
<text x="76" y="484" font-size="20" fill="#555">as long as PingFederate allows;</text>
<text x="76" y="514" font-size="20" fill="#555">the app has no sessions, and the</text>
<text x="76" y="544" font-size="20" fill="#555">device screen lock hides the screen</text>
<line x1="1040" y1="500" x2="978" y2="500" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="544" y1="500" x2="482" y2="500" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="48" y="650" width="1424" height="104" rx="12" fill="#efeeeb" stroke="#999" stroke-width="2"/>
<text x="76" y="692" font-size="20" fill="#555">The system holds no accounts and never sees a password or a second factor.</text>
<text x="76" y="726" font-size="20" fill="#555">If PingFederate is unavailable, nobody can sign in: there is no local sign-in to fall back on.</text>
</svg></body></html>
