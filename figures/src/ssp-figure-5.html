<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#fff;font-family:Segoe UI,Arial,sans-serif}</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="990" viewBox="0 0 1520 990" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0L10,5L0,10z" fill="#999"/></marker></defs>
<rect width="1520" height="990" fill="#fff"/>
<text x="48" y="55" font-size="30" font-weight="700" fill="#1a1a1a">Only managed devices reach &lt;System Name&gt;, and only through a browser</text>
<text x="48" y="92" font-size="21" fill="#555">Devices are managed by &lt;Organisation&gt; (inherited). No &lt;System Name&gt; software is installed on them.</text>
<rect x="48" y="144" width="464" height="128" rx="12" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="80" y="194" font-size="25" font-weight="700" fill="#1a1a1a">Office computers</text>
<text x="80" y="230" font-size="20" fill="#555">desktops and laptops</text>
<line x1="512" y1="208" x2="958" y2="208" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<text x="735" y="192" font-size="20" fill="#555" text-anchor="middle">office network, browser</text>
<rect x="960" y="144" width="512" height="128" rx="12" fill="#fff" stroke="#2e9e44" stroke-width="3"/>
<text x="992" y="194" font-size="25" font-weight="700" fill="#1a1a1a">Reach &lt;System Name&gt;</text>
<text x="992" y="230" font-size="20" fill="#555">sign-in through PingFederate, with MFA</text>
<rect x="48" y="304" width="464" height="128" rx="12" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="80" y="354" font-size="25" font-weight="700" fill="#1a1a1a">Laptops at home</text>
<text x="80" y="390" font-size="20" fill="#555">home working only</text>
<line x1="512" y1="368" x2="958" y2="368" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<text x="735" y="352" font-size="20" fill="#555" text-anchor="middle">VPN with MFA, then browser</text>
<rect x="960" y="304" width="512" height="128" rx="12" fill="#fff" stroke="#2e9e44" stroke-width="3"/>
<text x="992" y="354" font-size="25" font-weight="700" fill="#1a1a1a">Reach &lt;System Name&gt;</text>
<text x="992" y="390" font-size="20" fill="#555">same sign-in as in the office</text>
<rect x="48" y="464" width="464" height="128" rx="12" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="80" y="514" font-size="25" font-weight="700" fill="#1a1a1a">Phones and tablets</text>
<text x="80" y="550" font-size="20" fill="#555">managed by &lt;Organisation&gt;</text>
<line x1="512" y1="528" x2="958" y2="528" stroke="#999" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#a)"/>
<text x="735" y="512" font-size="20" fill="#555" text-anchor="middle">no route</text>
<rect x="960" y="464" width="512" height="128" rx="12" fill="#fff" stroke="#999" stroke-width="2" stroke-dasharray="8 6"/>
<text x="992" y="514" font-size="25" font-weight="700" fill="#1a1a1a">Cannot reach &lt;System Name&gt;</text>
<text x="992" y="550" font-size="20" fill="#555">not allowed on these devices</text>
<rect x="48" y="624" width="464" height="128" rx="12" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="80" y="674" font-size="25" font-weight="700" fill="#1a1a1a">Unmanaged devices</text>
<text x="80" y="710" font-size="20" fill="#555">personal or guest</text>
<line x1="512" y1="688" x2="958" y2="688" stroke="#999" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#a)"/>
<text x="735" y="672" font-size="20" fill="#555" text-anchor="middle">refused at the network</text>
<rect x="960" y="624" width="512" height="128" rx="12" fill="#fff" stroke="#999" stroke-width="2" stroke-dasharray="8 6"/>
<text x="992" y="674" font-size="25" font-weight="700" fill="#1a1a1a">Blocked</text>
<text x="992" y="710" font-size="20" fill="#555">by network access control</text>
<rect x="48" y="784" width="1424" height="170" rx="12" fill="#efeeeb" stroke="#999" stroke-width="2"/>
<text x="80" y="834" font-size="25" font-weight="700" fill="#1a1a1a">Controls on every managed device</text>
<text x="80" y="876" font-size="20" fill="#555">Device certificate for network access</text>
<text x="80" y="912" font-size="20" fill="#555">Full-disk encryption</text>
<text x="784" y="876" font-size="20" fill="#555">Screen lock that hides the display</text>
<text x="784" y="912" font-size="20" fill="#555">USB storage blocked unless approved</text>
</svg></body></html>
