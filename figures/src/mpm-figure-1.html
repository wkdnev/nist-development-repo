<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#fff;font-family:Segoe UI,Arial,sans-serif}</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="830" viewBox="0 0 1520 830" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0L10,5L0,10z" fill="#999"/></marker></defs>
<rect width="1520" height="830" fill="#fff"/>
<text x="48" y="55" font-size="30" font-weight="700" fill="#1a1a1a">What happens to every copy</text>
<text x="48" y="92" font-size="21" fill="#555">Disks, backups, exports, downloads, logs and printouts: each copy is protected as the documents are.</text>
<rect x="48" y="150" width="432" height="192" rx="12" fill="#fff" stroke="#2f6fd6" stroke-width="3"/>
<text x="76" y="198" font-size="25" font-weight="700" fill="#1a1a1a">1 Listed</text>
<text x="76" y="236" font-size="20" fill="#555">in the media inventory,</text>
<text x="76" y="267" font-size="20" fill="#555">before the place is used</text>
<rect x="544" y="150" width="432" height="192" rx="12" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="572" y="198" font-size="25" font-weight="700" fill="#1a1a1a">2 Limited</text>
<text x="572" y="236" font-size="20" fill="#555">only the roles named in the</text>
<text x="572" y="267" font-size="20" fill="#555">inventory can reach it</text>
<rect x="1040" y="150" width="432" height="192" rx="12" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="1068" y="198" font-size="25" font-weight="700" fill="#1a1a1a">3 Marked</text>
<text x="1068" y="236" font-size="20" fill="#555">RESTRICTED, with the</text>
<text x="1068" y="267" font-size="20" fill="#555">document's own classification</text>
<rect x="1040" y="430" width="432" height="192" rx="12" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="1068" y="478" font-size="25" font-weight="700" fill="#1a1a1a">4 Stored</text>
<text x="1068" y="516" font-size="20" fill="#555">encrypted, in a controlled</text>
<text x="1068" y="547" font-size="20" fill="#555">area; paper locked away</text>
<rect x="544" y="430" width="432" height="192" rx="12" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="572" y="478" font-size="25" font-weight="700" fill="#1a1a1a">5 Moved by exception</text>
<text x="572" y="516" font-size="20" fill="#555">approved, encrypted or</text>
<text x="572" y="547" font-size="20" fill="#555">sealed, tracked and recorded</text>
<rect x="48" y="430" width="432" height="192" rx="12" fill="#fff" stroke="#2e9e44" stroke-width="3"/>
<text x="76" y="478" font-size="25" font-weight="700" fill="#1a1a1a">6 Sanitised</text>
<text x="76" y="516" font-size="20" fill="#555">by the method for its type,</text>
<text x="76" y="547" font-size="20" fill="#555">before reuse, release or</text>
<text x="76" y="578" font-size="20" fill="#555">disposal, and recorded</text>
<line x1="480" y1="246" x2="542" y2="246" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="976" y1="246" x2="1038" y2="246" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="1256" y1="342" x2="1256" y2="428" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="1040" y1="526" x2="978" y2="526" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="544" y1="526" x2="482" y2="526" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="48" y="680" width="1424" height="100" rx="12" fill="#efeeeb" stroke="#999" stroke-width="2"/>
<text x="76" y="722" font-size="20" fill="#555">An export copy on the server is removed once downloaded, and within 24 hours at most.</text>
<text x="76" y="758" font-size="20" fill="#555">USB and other portable storage are blocked unless the system owner approves an exception.</text>
</svg></body></html>
