<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#fff;font-family:Segoe UI,Arial,sans-serif}</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="700" viewBox="0 0 1520 700" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0L10,5L0,10z" fill="#999"/></marker><marker id="b" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0L0,5L10,10z" fill="#999"/></marker></defs>
<rect width="1520" height="700" fill="#fff"/>
<text x="48" y="55" font-size="30" font-weight="700" fill="#1a1a1a">Recovery in three phases, inside 72 hours</text>
<text x="48" y="92" font-size="21" fill="#555">Activation and notification, recovery, then reconstitution, against the time allowed.</text>
<rect x="48" y="140" width="432" height="226" rx="12" fill="#fff" stroke="#2f6fd6" stroke-width="3"/>
<text x="76" y="188" font-size="25" font-weight="700" fill="#1a1a1a">1 Activation and notification</text>
<text x="76" y="226" font-size="20" fill="#555">the outage is assessed within</text>
<text x="76" y="256" font-size="20" fill="#555">4 hours; the system owner</text>
<text x="76" y="286" font-size="20" fill="#555">invokes the plan at 24 hours</text>
<text x="76" y="316" font-size="20" fill="#555">of outage, or sooner</text>
<rect x="544" y="140" width="432" height="226" rx="12" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="572" y="188" font-size="25" font-weight="700" fill="#1a1a1a">2 Recovery</text>
<text x="572" y="226" font-size="20" fill="#555">rebuild the servers; restore</text>
<text x="572" y="256" font-size="20" fill="#555">the backup and its logs;</text>
<text x="572" y="286" font-size="20" fill="#555">restore the secrets; start</text>
<text x="572" y="316" font-size="20" fill="#555">the applications</text>
<rect x="1040" y="140" width="432" height="226" rx="12" fill="#fff" stroke="#2e9e44" stroke-width="3"/>
<text x="1068" y="188" font-size="25" font-weight="700" fill="#1a1a1a">3 Reconstitution</text>
<text x="1068" y="226" font-size="20" fill="#555">check the data, the functions</text>
<text x="1068" y="256" font-size="20" fill="#555">and the controls; declare</text>
<text x="1068" y="286" font-size="20" fill="#555">recovery; take a full backup</text>
<text x="1068" y="316" font-size="20" fill="#555">at once</text>
<line x1="480" y1="253.0" x2="542" y2="253.0" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="976" y1="253.0" x2="1038" y2="253.0" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="50" y1="420" x2="1470" y2="420" stroke="#999" stroke-width="2.5" marker-start="url(#b)" marker-end="url(#a)"/>
<text x="48" y="464" font-size="24" font-weight="700" fill="#1a1a1a">Users return within 72 hours of the plan being invoked. No more than 24 hours of data is lost.</text>
<text x="48" y="500" font-size="20" fill="#555">The most the business can bear is 120 hours, which leaves 48 hours for a failed first attempt.</text>
<rect x="48" y="548" width="1424" height="112" rx="12" fill="#efeeeb" stroke="#999" stroke-width="2"/>
<text x="76" y="595" font-size="20" fill="#555">If the outage may be a security incident, the incident response plan leads and this plan supports it.</text>
<text x="76" y="627" font-size="20" fill="#555">Nothing can be recovered until &lt;Organisation&gt; has restored its network, PingFederate and Active Directory.</text>
</svg></body></html>
