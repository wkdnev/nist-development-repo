<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#fff;font-family:Segoe UI,Arial,sans-serif}</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="820" viewBox="0 0 1520 820" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0L10,5L0,10z" fill="#999"/></marker></defs>
<rect width="1520" height="820" fill="#fff"/>
<text x="48" y="55" font-size="30" font-weight="700" fill="#1a1a1a">How information is protected in the system</text>
<text x="48" y="92" font-size="21" fill="#555">Deny by default, encrypt everything that moves, and know every key.</text>
<rect x="48" y="152" width="432" height="192" rx="12" fill="#fff" stroke="#2f6fd6" stroke-width="3"/>
<text x="76" y="200" font-size="25" font-weight="700" fill="#1a1a1a">1 User or administrator</text>
<text x="76" y="238" font-size="20" fill="#555">on &lt;Organisation&gt;'s network (F1),</text>
<text x="76" y="268" font-size="20" fill="#555">or its managed administration</text>
<text x="76" y="298" font-size="20" fill="#555">route (F2, F11)</text>
<rect x="544" y="152" width="432" height="192" rx="12" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="572" y="200" font-size="25" font-weight="700" fill="#1a1a1a">2 Network edge</text>
<text x="572" y="238" font-size="20" fill="#555">&lt;Organisation&gt;'s firewalls, proxy</text>
<text x="572" y="268" font-size="20" fill="#555">and DNS allow only the</text>
<text x="572" y="298" font-size="20" fill="#555">flows F1 to F8, F10 and F11</text>
<rect x="1040" y="152" width="432" height="192" rx="12" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="1068" y="200" font-size="25" font-weight="700" fill="#1a1a1a">3 Application server</text>
<text x="1068" y="238" font-size="20" fill="#555">host firewall; UI app on 443;</text>
<text x="1068" y="268" font-size="20" fill="#555">Admin app on the admin route;</text>
<text x="1068" y="298" font-size="20" fill="#555">API on loopback only (F3, F4)</text>
<rect x="1040" y="432" width="432" height="192" rx="12" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="1068" y="480" font-size="25" font-weight="700" fill="#1a1a1a">4 Database server</text>
<text x="1068" y="518" font-size="20" fill="#555">SQL Server accepts only the</text>
<text x="1068" y="548" font-size="20" fill="#555">API (F5): TLS with strict</text>
<text x="1068" y="578" font-size="20" fill="#555">encryption, Windows authentication</text>
<rect x="544" y="432" width="432" height="192" rx="12" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="572" y="480" font-size="25" font-weight="700" fill="#1a1a1a">5 At rest</text>
<text x="572" y="518" font-size="20" fill="#555">BitLocker on both servers,</text>
<text x="572" y="548" font-size="20" fill="#555">encrypted backups, and key</text>
<text x="572" y="578" font-size="20" fill="#555">rings protected by DPAPI</text>
<rect x="48" y="432" width="432" height="192" rx="12" fill="#fff" stroke="#2e9e44" stroke-width="3"/>
<text x="76" y="480" font-size="25" font-weight="700" fill="#1a1a1a">6 Keys and certificates</text>
<text x="76" y="518" font-size="20" fill="#555">every key in the register,</text>
<text x="76" y="548" font-size="20" fill="#555">owned, stored outside code</text>
<text x="76" y="578" font-size="20" fill="#555">and changed on time</text>
<line x1="480" y1="248" x2="542" y2="248" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="976" y1="248" x2="1038" y2="248" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="1256" y1="344" x2="1256" y2="430" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="1040" y1="528" x2="978" y2="528" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="544" y1="528" x2="482" y2="528" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="48" y="680" width="1424" height="100" rx="12" fill="#efeeeb" stroke="#999" stroke-width="2"/>
<text x="76" y="722" font-size="20" fill="#555">Every flow that carries data uses TLS under NCSC's profiles: TLS 1.3 preferred, TLS 1.2 with GCM only.</text>
<text x="76" y="756" font-size="20" fill="#555">Pages run only code that &lt;System Name&gt; serves, under a strict page policy.</text>
</svg></body></html>
