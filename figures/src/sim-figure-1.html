<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#fff;font-family:Segoe UI,Arial,sans-serif}</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="820" viewBox="0 0 1520 820" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0L10,5L0,10z" fill="#999"/></marker></defs>
<rect width="1520" height="820" fill="#fff"/>
<text x="48" y="55" font-size="30" font-weight="700" fill="#1a1a1a">How integrity is kept, from upload to alert</text>
<text x="48" y="92" font-size="21" fill="#555">Check what comes in, watch what happens, and prove nothing has changed.</text>
<rect x="48" y="152" width="432" height="192" rx="12" fill="#fff" stroke="#2f6fd6" stroke-width="3"/>
<text x="76" y="200" font-size="25" font-weight="700" fill="#1a1a1a">1 Upload checked</text>
<text x="76" y="238" font-size="20" fill="#555">type, signature, size and</text>
<text x="76" y="268" font-size="20" fill="#555">name checked on the server</text>
<text x="76" y="298" font-size="20" fill="#555">before anything is stored</text>
<rect x="544" y="152" width="432" height="192" rx="12" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="572" y="200" font-size="25" font-weight="700" fill="#1a1a1a">2 Malware scan</text>
<text x="572" y="238" font-size="20" fill="#555">each upload passed to</text>
<text x="572" y="268" font-size="20" fill="#555">Defender through AMSI;</text>
<text x="572" y="298" font-size="20" fill="#555">anything flagged is refused</text>
<rect x="1040" y="152" width="432" height="192" rx="12" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="1068" y="200" font-size="25" font-weight="700" fill="#1a1a1a">3 Stored and baselined</text>
<text x="1068" y="238" font-size="20" fill="#555">files and releases protected</text>
<text x="1068" y="268" font-size="20" fill="#555">with SHA-256; audit records</text>
<text x="1068" y="298" font-size="20" fill="#555">chained by a keyed hash</text>
<rect x="1040" y="432" width="432" height="192" rx="12" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="1068" y="480" font-size="25" font-weight="700" fill="#1a1a1a">4 Logged</text>
<text x="1068" y="518" font-size="20" fill="#555">application, Windows and</text>
<text x="1068" y="548" font-size="20" fill="#555">SQL Server logs forwarded</text>
<text x="1068" y="578" font-size="20" fill="#555">to central logging</text>
<rect x="544" y="432" width="432" height="192" rx="12" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="572" y="480" font-size="25" font-weight="700" fill="#1a1a1a">5 Alerted and reviewed</text>
<text x="572" y="518" font-size="20" fill="#555">nine detection use cases;</text>
<text x="572" y="548" font-size="20" fill="#555">the security officer reviews</text>
<text x="572" y="578" font-size="20" fill="#555">every week</text>
<rect x="48" y="432" width="432" height="192" rx="12" fill="#fff" stroke="#2e9e44" stroke-width="3"/>
<text x="76" y="480" font-size="25" font-weight="700" fill="#1a1a1a">6 Fixed on time</text>
<text x="76" y="518" font-size="20" fill="#555">advisories and scans feed</text>
<text x="76" y="548" font-size="20" fill="#555">fixes to the one timetable,</text>
<text x="76" y="578" font-size="20" fill="#555">through change control</text>
<line x1="480" y1="248" x2="542" y2="248" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="976" y1="248" x2="1038" y2="248" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="1256" y1="344" x2="1256" y2="430" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="1040" y1="528" x2="978" y2="528" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="544" y1="528" x2="482" y2="528" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="48" y="680" width="1424" height="100" rx="12" fill="#efeeeb" stroke="#999" stroke-width="2"/>
<text x="76" y="722" font-size="20" fill="#555">Advisories come from NCSC, CISA and the vendors of every component, including Microsoft for Windows, .NET and SQL Server.</text>
<text x="76" y="756" font-size="20" fill="#555">Releases, stored files and audit records are checked against the baseline at start-up, at each release and every month.</text>
</svg></body></html>
