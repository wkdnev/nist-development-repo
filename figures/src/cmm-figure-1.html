<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#fff;font-family:Segoe UI,Arial,sans-serif}</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="860" viewBox="0 0 1520 860" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0L10,5L0,10z" fill="#999"/></marker><marker id="b" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0L0,5L10,10z" fill="#999"/></marker></defs>
<rect width="1520" height="860" fill="#fff"/>
<text x="48" y="55" font-size="30" font-weight="700" fill="#1a1a1a">Every change follows one route</text>
<text x="48" y="92" font-size="21" fill="#555">The design. The ServiceNow workflow is not set up yet, and no change has followed it.</text>
<rect x="48" y="140" width="432" height="196" rx="12" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="76" y="188" font-size="25" font-weight="700" fill="#1a1a1a">1 Request</text>
<text x="76" y="226" font-size="20" fill="#555">whoever needs the change raises</text>
<text x="76" y="256" font-size="20" fill="#555">it in ServiceNow, saying what</text>
<text x="76" y="286" font-size="20" fill="#555">and why</text>
<rect x="544" y="140" width="432" height="196" rx="12" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="572" y="188" font-size="25" font-weight="700" fill="#1a1a1a">2 Impact analysis</text>
<text x="572" y="226" font-size="20" fill="#555">the security officer answers</text>
<text x="572" y="256" font-size="20" fill="#555">eight questions, and rates</text>
<text x="572" y="286" font-size="20" fill="#555">the impact</text>
<rect x="1040" y="140" width="432" height="196" rx="12" fill="#fff" stroke="#2f6fd6" stroke-width="3"/>
<text x="1068" y="188" font-size="25" font-weight="700" fill="#1a1a1a">3 Decision</text>
<text x="1068" y="226" font-size="20" fill="#555">the change control board</text>
<text x="1068" y="256" font-size="20" fill="#555">approves, refuses, defers or</text>
<text x="1068" y="286" font-size="20" fill="#555">asks for more</text>
<rect x="1040" y="420" width="432" height="196" rx="12" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="1068" y="468" font-size="25" font-weight="700" fill="#1a1a1a">4 Make and test</text>
<text x="1068" y="506" font-size="20" fill="#555">on a separate test</text>
<text x="1068" y="536" font-size="20" fill="#555">environment, before release</text>
<rect x="544" y="420" width="432" height="196" rx="12" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="572" y="468" font-size="25" font-weight="700" fill="#1a1a1a">5 Verify</text>
<text x="572" y="506" font-size="20" fill="#555">check the controls the</text>
<text x="572" y="536" font-size="20" fill="#555">change touched still work</text>
<rect x="48" y="420" width="432" height="196" rx="12" fill="#fff" stroke="#2e9e44" stroke-width="3"/>
<text x="76" y="468" font-size="25" font-weight="700" fill="#1a1a1a">6 Update</text>
<text x="76" y="506" font-size="20" fill="#555">the baseline, the component</text>
<text x="76" y="536" font-size="20" fill="#555">list and the inventory; tag</text>
<text x="76" y="566" font-size="20" fill="#555">the release</text>
<line x1="480" y1="238.0" x2="542" y2="238.0" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="976" y1="238.0" x2="1038" y2="238.0" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="1256.0" y1="336" x2="1256.0" y2="418" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="1040" y1="518.0" x2="978" y2="518.0" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="544" y1="518.0" x2="482" y2="518.0" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="48" y="676" width="1424" height="144" rx="12" fill="#efeeeb" stroke="#999" stroke-width="2"/>
<text x="76" y="723" font-size="20" fill="#555">A significant change, or one of High impact, goes to the authorising official before step 4.</text>
<text x="76" y="755" font-size="20" fill="#555">An emergency change is approved by the system owner first, recorded within 1 working day,</text>
<text x="76" y="787" font-size="20" fill="#555">and confirmed or reversed by the board at its next meeting.</text>
</svg></body></html>
