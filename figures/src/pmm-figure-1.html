<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#fff;font-family:Segoe UI,Arial,sans-serif}</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="830" viewBox="0 0 1520 830" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0L10,5L0,10z" fill="#999"/></marker></defs>
<rect width="1520" height="830" fill="#fff"/>
<text x="48" y="55" font-size="30" font-weight="700" fill="#1a1a1a">How &lt;System Name&gt; relies on the organisation's programme</text>
<text x="48" y="92" font-size="21" fill="#555">The 36 programme controls are met once, for the organisation, and inherited by &lt;System Name&gt;.</text>
<rect x="48" y="150" width="432" height="192" rx="12" fill="#fff" stroke="#2f6fd6" stroke-width="3"/>
<text x="76" y="198" font-size="25" font-weight="700" fill="#1a1a1a">The programme</text>
<text x="76" y="236" font-size="20" fill="#555">&lt;Organisation&gt;'s plans,</text>
<text x="76" y="267" font-size="20" fill="#555">strategies and inventories, and</text>
<text x="76" y="298" font-size="20" fill="#555">the people who lead them</text>
<rect x="544" y="150" width="432" height="192" rx="12" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="572" y="198" font-size="25" font-weight="700" fill="#1a1a1a">&lt;System Name&gt; inherits it</text>
<text x="572" y="236" font-size="20" fill="#555">its policies, plans and</text>
<text x="572" y="267" font-size="20" fill="#555">registers follow the</text>
<text x="572" y="298" font-size="20" fill="#555">programme</text>
<rect x="1040" y="150" width="432" height="192" rx="12" fill="#fff" stroke="#2e9e44" stroke-width="3"/>
<text x="1068" y="198" font-size="25" font-weight="700" fill="#1a1a1a">&lt;System Name&gt; feeds back</text>
<text x="1068" y="236" font-size="20" fill="#555">its risks, weaknesses,</text>
<text x="1068" y="267" font-size="20" fill="#555">monitoring results and</text>
<text x="1068" y="298" font-size="20" fill="#555">inventory entries</text>
<line x1="480" y1="246" x2="542" y2="246" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="976" y1="246" x2="1038" y2="246" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="48" y="430" width="432" height="192" rx="12" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="76" y="478" font-size="25" font-weight="700" fill="#1a1a1a">Security programme</text>
<text x="76" y="516" font-size="20" fill="#555">19 controls: plan, leader,</text>
<text x="76" y="547" font-size="20" fill="#555">resources, inventory,</text>
<text x="76" y="578" font-size="20" fill="#555">architecture, workforce</text>
<rect x="544" y="430" width="432" height="192" rx="12" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="572" y="478" font-size="25" font-weight="700" fill="#1a1a1a">Risk management</text>
<text x="572" y="516" font-size="20" fill="#555">5 controls: strategy, risk</text>
<text x="572" y="547" font-size="20" fill="#555">framing, supply chain,</text>
<text x="572" y="578" font-size="20" fill="#555">continuous monitoring</text>
<rect x="1040" y="430" width="432" height="192" rx="12" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="1068" y="478" font-size="25" font-weight="700" fill="#1a1a1a">Privacy programme</text>
<text x="1068" y="516" font-size="20" fill="#555">12 controls: plan, leader,</text>
<text x="1068" y="547" font-size="20" fill="#555">disclosures, complaints,</text>
<text x="1068" y="578" font-size="20" fill="#555">reporting</text>
<rect x="48" y="680" width="1424" height="100" rx="12" fill="#efeeeb" stroke="#999" stroke-width="2"/>
<text x="76" y="722" font-size="20" fill="#555">The programme controls are outside the Moderate baseline, so they are not assessed for &lt;System Name&gt;.</text>
<text x="76" y="758" font-size="20" fill="#555">Twenty-four are in the privacy baseline. None of &lt;Organisation&gt;'s programme is evidenced yet.</text>
</svg></body></html>
