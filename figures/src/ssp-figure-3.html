<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#fff;font-family:Segoe UI,Arial,sans-serif}</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="910" viewBox="0 0 1520 910" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0L10,5L0,10z" fill="#999"/></marker></defs>
<text x="48" y="55" font-size="30" font-weight="700" fill="#1a1a1a">Every route to &lt;System Name&gt; passes the VPN or the organisation's firewalls</text>
<text x="48" y="92" font-size="21" fill="#555">The design on the two VMs. Flows as in the System Description, section 6.5. Dashed: outside the system or blocked.</text>
<!-- outside -->
<rect x="48" y="130" width="328" height="750" rx="16" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="72" y="170" font-size="25" font-weight="700">Outside</text>
<rect x="72" y="200" width="280" height="130" rx="12" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="98" y="242" font-size="25" font-weight="700">Home user</text>
<text x="98" y="275" font-size="20" fill="#555">managed laptop</text>
<rect x="72" y="420" width="280" height="130" rx="12" fill="#fff" stroke="#999" stroke-width="2" stroke-dasharray="8 6"/>
<text x="98" y="462" font-size="25" font-weight="700">Internet</text>
<text x="98" y="495" font-size="20" fill="#555">no route to or from</text><text x="98" y="521" font-size="20" fill="#555">the system</text>
<rect x="72" y="640" width="280" height="130" rx="12" fill="#fff" stroke="#999" stroke-width="2" stroke-dasharray="8 6"/>
<text x="98" y="682" font-size="25" font-weight="700">Other devices</text>
<text x="98" y="715" font-size="20" fill="#555">unmanaged or</text><text x="98" y="741" font-size="20" fill="#555">personal: blocked</text>
<line x1="352" y1="705" x2="390" y2="705" stroke="#999" stroke-width="2.5"/><line x1="390" y1="685" x2="390" y2="725" stroke="#999" stroke-width="3"/>
<line x1="352" y1="485" x2="390" y2="485" stroke="#999" stroke-width="2.5"/><line x1="390" y1="465" x2="390" y2="505" stroke="#999" stroke-width="3"/>
<!-- corporate network -->
<rect x="400" y="130" width="1072" height="750" rx="16" fill="#efeeeb" stroke="#999" stroke-width="2"/>
<text x="432" y="170" font-size="25" font-weight="700">&lt;Organisation&gt; corporate network</text>
<rect x="432" y="200" width="280" height="130" rx="12" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="458" y="242" font-size="25" font-weight="700">VPN gateway</text>
<text x="458" y="275" font-size="20" fill="#555">MFA, encrypted,</text><text x="458" y="301" font-size="20" fill="#555">no split tunnelling</text>
<rect x="432" y="420" width="280" height="130" rx="12" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="458" y="462" font-size="25" font-weight="700">Office devices</text>
<text x="458" y="495" font-size="20" fill="#555">managed devices</text>
<rect x="432" y="640" width="280" height="130" rx="12" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="458" y="682" font-size="25" font-weight="700">Admin route</text>
<text x="458" y="715" font-size="20" fill="#555">managed route, MFA;</text><text x="458" y="741" font-size="20" fill="#555">from &lt;Organisation&gt;</text>
<line x1="352" y1="265" x2="430" y2="265" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="712" y1="265" x2="742" y2="265" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="712" y1="485" x2="742" y2="485" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="712" y1="705" x2="742" y2="705" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="744" y="200" width="208" height="570" rx="12" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="768" y="242" font-size="25" font-weight="700">Firewalls</text>
<text x="768" y="277" font-size="20" fill="#555">only F1 to F8</text>
<text x="768" y="303" font-size="20" fill="#555">allowed; each</text>
<text x="768" y="329" font-size="20" fill="#555">server also has</text>
<text x="768" y="355" font-size="20" fill="#555">its own firewall</text>
<!-- boundary -->
<rect x="976" y="190" width="472" height="410" rx="16" fill="#fff" stroke="#2f6fd6" stroke-width="3"/>
<text x="1004" y="230" font-size="25" font-weight="700">&lt;System Name&gt; boundary</text>
<rect x="1004" y="252" width="416" height="160" rx="12" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="1028" y="292" font-size="24" font-weight="700">Application VM</text>
<text x="1028" y="325" font-size="19" fill="#555">UI app: HTTPS, TCP 443 (F1)</text>
<text x="1028" y="352" font-size="19" fill="#555">Admin app: admin route only (F2)</text>
<text x="1028" y="379" font-size="19" fill="#555">API: loopback only (F3, F4)</text>
<rect x="1052" y="460" width="324" height="118" rx="12" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="1076" y="500" font-size="24" font-weight="700">Database VM</text>
<text x="1076" y="531" font-size="19" fill="#555">SQL Server, TLS, TCP 1433,</text>
<text x="1076" y="557" font-size="19" fill="#555">from the API only (F5)</text>
<line x1="1214" y1="412" x2="1214" y2="458" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="952" y1="332" x2="1002" y2="332" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<!-- provider services -->
<rect x="976" y="650" width="220" height="200" rx="12" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="1000" y="690" font-size="23" font-weight="700">Sign-in and</text>
<text x="1000" y="718" font-size="23" font-weight="700">directory</text>
<text x="1000" y="751" font-size="19" fill="#555">PingFederate (F6);</text>
<text x="1000" y="777" font-size="19" fill="#555">AD over LDAPS,</text>
<text x="1000" y="803" font-size="19" fill="#555">TCP 636 (F7)</text>
<rect x="1220" y="650" width="228" height="200" rx="12" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="1244" y="690" font-size="23" font-weight="700">Time, logging,</text>
<text x="1244" y="718" font-size="23" font-weight="700">proxy, backup</text>
<text x="1244" y="751" font-size="19" fill="#555">from both</text>
<text x="1244" y="777" font-size="19" fill="#555">servers (F8)</text>
<line x1="1032" y1="412" x2="1032" y2="648" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="1290" y1="578" x2="1290" y2="648" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="1400" y1="412" x2="1400" y2="648" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
</svg></body></html>
