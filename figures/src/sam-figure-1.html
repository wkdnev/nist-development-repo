<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#fff;font-family:Segoe UI,Arial,sans-serif}</style></head><body>

<rect width="1520" height="842" fill="#fff"/>
<text x="48" y="55" font-size="30" font-weight="700" fill="#1a1a1a">How the system is built and bought</text>
<text x="48" y="92" font-size="21" fill="#555">Six stages, each with its security and privacy check.</text>
<rect x="48" y="130" width="424" height="210" rx="12" fill="#d9e1ec" stroke="#2f6fd6" stroke-width="3"/>
<text x="76" y="180" font-size="25" font-weight="700" fill="#1a1a1a">1 Plan</text>
<text x="76" y="222" font-size="20" fill="#555">the security and privacy</text>
<text x="76" y="253" font-size="20" fill="#555">effect of each change</text>
<text x="76" y="284" font-size="20" fill="#555">is noted</text>
<rect x="548" y="130" width="424" height="210" rx="12" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="576" y="180" font-size="25" font-weight="700" fill="#1a1a1a">2 Design</text>
<text x="576" y="222" font-size="20" fill="#555">significant designs checked</text>
<text x="576" y="253" font-size="20" fill="#555">against the principles;</text>
<text x="576" y="284" font-size="20" fill="#555">critical components updated</text>
<rect x="1048" y="130" width="424" height="210" rx="12" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="1076" y="180" font-size="25" font-weight="700" fill="#1a1a1a">3 Build</text>
<text x="1076" y="222" font-size="20" fill="#555">a second developer reviews</text>
<text x="1076" y="253" font-size="20" fill="#555">each change; new components</text>
<text x="1076" y="284" font-size="20" fill="#555">are checked first</text>
<rect x="1048" y="420" width="424" height="210" rx="12" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="1076" y="470" font-size="25" font-weight="700" fill="#1a1a1a">4 Test</text>
<text x="1076" y="512" font-size="20" fill="#555">15 test scripts at each</text>
<text x="1076" y="543" font-size="20" fill="#555">release; web apps verified</text>
<text x="1076" y="574" font-size="20" fill="#555">to OWASP ASVS Level 2</text>
<rect x="548" y="420" width="424" height="210" rx="12" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="576" y="470" font-size="25" font-weight="700" fill="#1a1a1a">5 Release</text>
<text x="576" y="512" font-size="20" fill="#555">through change control,</text>
<text x="576" y="543" font-size="20" fill="#555">with a signed tag and</text>
<text x="576" y="574" font-size="20" fill="#555">the guides confirmed</text>
<rect x="48" y="420" width="424" height="210" rx="12" fill="#fff" stroke="#2e9e44" stroke-width="3"/>
<text x="76" y="470" font-size="25" font-weight="700" fill="#1a1a1a">6 Retire</text>
<text x="76" y="512" font-size="20" fill="#555">components replaced before</text>
<text x="76" y="543" font-size="20" fill="#555">support ends; data and</text>
<text x="76" y="574" font-size="20" fill="#555">media disposed of</text>

<line x1="972" y1="235" x2="1046" y2="235" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>

<line x1="548" y1="525" x2="474" y2="525" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="48" y="690" width="1424" height="112" rx="12" fill="#efeeeb" stroke="#999" stroke-width="2"/>
<text x="76" y="734" font-size="20" fill="#555">Development follows &lt;Organisation&gt;&#x27;s corporate SDLC (inherited), checked practice by practice against CSS.</text>
<text x="76" y="770" font-size="20" fill="#555">Anything bought is under a contract with security terms, and each outside service is reviewed every 12 months.</text>
