<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#fff;font-family:Segoe UI,Arial,sans-serif}</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="842" viewBox="0 0 1520 842" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0L10,5L0,10z" fill="#999"/></marker></defs>
<rect width="1520" height="842" fill="#fff"/>
<text x="48" y="55" font-size="30" font-weight="700" fill="#1a1a1a">From joining to leaving</text>
<text x="48" y="92" font-size="21" fill="#555">The system holds no accounts: access is membership of its Active Directory groups.</text>
<rect x="48" y="130" width="424" height="210" rx="12" fill="#d9e1ec" stroke="#2f6fd6" stroke-width="3"/>
<text x="76" y="180" font-size="25" font-weight="700" fill="#1a1a1a">1 Designate</text>
<text x="76" y="222" font-size="20" fill="#555">the role is higher risk</text>
<text x="76" y="253" font-size="20" fill="#555">or standard</text>
<rect x="548" y="130" width="424" height="210" rx="12" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="576" y="180" font-size="25" font-weight="700" fill="#1a1a1a">2 Screen</text>
<text x="576" y="222" font-size="20" fill="#555">&lt;Organisation&gt; confirms the</text>
<text x="576" y="253" font-size="20" fill="#555">checks; only who confirmed</text>
<text x="576" y="284" font-size="20" fill="#555">it, and the date, is recorded</text>
<rect x="1048" y="130" width="424" height="210" rx="12" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="1076" y="180" font-size="25" font-weight="700" fill="#1a1a1a">3 Sign</text>
<text x="1076" y="222" font-size="20" fill="#555">the confidentiality agreement</text>
<text x="1076" y="253" font-size="20" fill="#555">and the rules of behaviour,</text>
<text x="1076" y="284" font-size="20" fill="#555">before any access</text>
<rect x="1048" y="420" width="424" height="210" rx="12" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="1076" y="470" font-size="25" font-weight="700" fill="#1a1a1a">4 Join</text>
<text x="1076" y="512" font-size="20" fill="#555">approved in ServiceNow; the</text>
<text x="1076" y="543" font-size="20" fill="#555">group owners add the person</text>
<text x="1076" y="574" font-size="20" fill="#555">to the groups the role needs</text>
<rect x="548" y="420" width="424" height="210" rx="12" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="576" y="470" font-size="25" font-weight="700" fill="#1a1a1a">5 Move</text>
<text x="576" y="512" font-size="20" fill="#555">each owner reviews and</text>
<text x="576" y="543" font-size="20" fill="#555">changes the memberships</text>
<text x="576" y="574" font-size="20" fill="#555">within 1 working day</text>
<rect x="48" y="420" width="424" height="210" rx="12" fill="#fff" stroke="#2e9e44" stroke-width="3"/>
<text x="76" y="470" font-size="25" font-weight="700" fill="#1a1a1a">6 Leave</text>
<text x="76" y="512" font-size="20" fill="#555">the AD account is disabled</text>
<text x="76" y="543" font-size="20" fill="#555">at once; the urgent route,</text>
<text x="76" y="574" font-size="20" fill="#555">within 1 hour, for higher risk</text>
<line x1="472" y1="235" x2="546" y2="235" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="972" y1="235" x2="1046" y2="235" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="1260" y1="340" x2="1260" y2="418" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="1048" y1="525" x2="974" y2="525" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="548" y1="525" x2="474" y2="525" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="48" y="690" width="1424" height="112" rx="12" fill="#efeeeb" stroke="#999" stroke-width="2"/>
<text x="76" y="734" font-size="20" fill="#555">Screening results and criminal record data stay with &lt;Organisation&gt;, never in the system.</text>
<text x="76" y="770" font-size="20" fill="#555">Each schema&#x27;s groups are owned by its Data Owner. Higher risk roles are screened again before the role is granted, and every 5 years.</text>
</svg></body></html>
