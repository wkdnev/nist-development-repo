<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#fff;font-family:Segoe UI,Arial,sans-serif}</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="842" viewBox="0 0 1520 842" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0L10,5L0,10z" fill="#999"/></marker></defs>
<rect width="1520" height="842" fill="#fff"/>
<text x="48" y="55" font-size="30" font-weight="700" fill="#1a1a1a">How risk is assessed and answered in the system</text>
<text x="48" y="92" font-size="21" fill="#555">The same cycle answers findings from assessments, monitoring and audits.</text>
<rect x="48" y="130" width="424" height="210" rx="12" fill="#d9e1ec" stroke="#2f6fd6" stroke-width="3"/>
<text x="76" y="180" font-size="25" font-weight="700" fill="#1a1a1a">1 Categorise</text>
<text x="76" y="222" font-size="20" fill="#555">Moderate, from the</text>
<text x="76" y="253" font-size="20" fill="#555">application's information</text>
<text x="76" y="284" font-size="20" fill="#555">types, the highest of each</text>
<rect x="548" y="130" width="424" height="210" rx="12" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="576" y="180" font-size="25" font-weight="700" fill="#1a1a1a">2 Assess risk</text>
<text x="576" y="222" font-size="20" fill="#555">threats and weaknesses</text>
<text x="576" y="253" font-size="20" fill="#555">rated by likelihood and</text>
<text x="576" y="284" font-size="20" fill="#555">impact; supply chain yearly</text>
<rect x="1048" y="130" width="424" height="210" rx="12" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="1076" y="180" font-size="25" font-weight="700" fill="#1a1a1a">3 Monitor and scan</text>
<text x="1076" y="222" font-size="20" fill="#555">packages at each build;</text>
<text x="1076" y="253" font-size="20" fill="#555">both servers monthly;</text>
<text x="1076" y="284" font-size="20" fill="#555">exploited flaws daily</text>
<rect x="1048" y="420" width="424" height="210" rx="12" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="1076" y="470" font-size="25" font-weight="700" fill="#1a1a1a">4 Analyse</text>
<text x="1076" y="512" font-size="20" fill="#555">each finding recorded</text>
<text x="1076" y="543" font-size="20" fill="#555">within 5 working days,</text>
<text x="1076" y="574" font-size="20" fill="#555">with its due date</text>
<rect x="548" y="420" width="424" height="210" rx="12" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="576" y="470" font-size="25" font-weight="700" fill="#1a1a1a">5 Respond</text>
<text x="576" y="512" font-size="20" fill="#555">fix or mitigate in time,</text>
<text x="576" y="543" font-size="20" fill="#555">or a named person decides;</text>
<text x="576" y="574" font-size="20" fill="#555">plans go in the POA&amp;M</text>
<rect x="48" y="420" width="424" height="210" rx="12" fill="#fff" stroke="#2e9e44" stroke-width="3"/>
<text x="76" y="470" font-size="25" font-weight="700" fill="#1a1a1a">6 Review</text>
<text x="76" y="512" font-size="20" fill="#555">every 12 months and at</text>
<text x="76" y="543" font-size="20" fill="#555">each significant change,</text>
<text x="76" y="574" font-size="20" fill="#555">with the critical components</text>
<line x1="472" y1="235" x2="546" y2="235" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="972" y1="235" x2="1046" y2="235" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="1260" y1="340" x2="1260" y2="418" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="1048" y1="525" x2="974" y2="525" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="548" y1="525" x2="474" y2="525" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="260" y1="420" x2="260" y2="342" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="48" y="690" width="1424" height="112" rx="12" fill="#efeeeb" stroke="#999" stroke-width="2"/>
<text x="76" y="734" font-size="20" fill="#555">Fix or mitigate: exploited 3 days; Critical and High 14 days; Medium 30 days; Low 90 days.</text>
<text x="76" y="770" font-size="20" fill="#555">Anyone can report a vulnerability through &lt;Organisation&gt;&#x27;s security contact, which passes it to the security officer.</text>
</svg></body></html>
