<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#fff}</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="760" viewBox="0 0 1520 760" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0L10,5L0,10z" fill="#999"/></marker></defs>
<rect width="1520" height="760" fill="#fff"/>
<text x="48" y="55" font-size="30" font-weight="700" fill="#1a1a1a">An auditor's route through the set takes six steps</text>
<text x="48" y="92" font-size="21" fill="#555">Steps 4 to 6 are repeated for each family chosen.</text>
<rect x="48" y="140" width="440" height="230" rx="12" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="76" y="186" font-size="25" font-weight="700" fill="#1a1a1a">1 Get your bearings</text>
<text x="76" y="224" font-size="20" fill="#555">This guide and</text>
<text x="76" y="253" font-size="20" fill="#555">&lt;Documentation Map&gt;:</text>
<text x="76" y="282" font-size="20" fill="#555">the groups and each</text>
<text x="76" y="311" font-size="20" fill="#555">family's design document</text>
<rect x="540" y="140" width="440" height="230" rx="12" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="568" y="186" font-size="25" font-weight="700" fill="#1a1a1a">2 Understand the system</text>
<text x="568" y="224" font-size="20" fill="#555">&lt;System Description&gt;, the</text>
<text x="568" y="253" font-size="20" fill="#555">security plan and</text>
<text x="568" y="282" font-size="20" fill="#555">&lt;Concept of Operations&gt;</text>
<rect x="1032" y="140" width="440" height="230" rx="12" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="1060" y="186" font-size="25" font-weight="700" fill="#1a1a1a">3 See the overall result</text>
<text x="1060" y="224" font-size="20" fill="#555">&lt;Security Assessment Report&gt;</text>
<text x="1060" y="253" font-size="20" fill="#555">and the security plan's</text>
<text x="1060" y="282" font-size="20" fill="#555">line for each control</text>
<rect x="48" y="470" width="440" height="230" rx="12" fill="#fff" stroke="#2f6fd6" stroke-width="3"/>
<text x="76" y="516" font-size="25" font-weight="700" fill="#1a1a1a">6 Test and ask</text>
<text x="76" y="554" font-size="20" fill="#555">Repeat the tests, use</text>
<text x="76" y="583" font-size="20" fill="#555">&lt;Interview Guide&gt; and</text>
<text x="76" y="612" font-size="20" fill="#555">&lt;Evidence Requests&gt;, and</text>
<text x="76" y="641" font-size="20" fill="#555">check completed forms</text>
<rect x="540" y="470" width="440" height="230" rx="12" fill="#fff" stroke="#2f6fd6" stroke-width="3"/>
<text x="568" y="516" font-size="25" font-weight="700" fill="#1a1a1a">5 Follow a gap</text>
<text x="568" y="554" font-size="20" fill="#555">Its entry in &lt;Risk List&gt;, its</text>
<text x="568" y="583" font-size="20" fill="#555">item in the plan of action,</text>
<text x="568" y="612" font-size="20" fill="#555">and its decision in</text>
<text x="568" y="641" font-size="20" fill="#555">&lt;Decision Register&gt;</text>
<rect x="1032" y="470" width="440" height="230" rx="12" fill="#fff" stroke="#2f6fd6" stroke-width="3"/>
<text x="1060" y="516" font-size="25" font-weight="700" fill="#1a1a1a">4 Take a family</text>
<text x="1060" y="554" font-size="20" fill="#555">Its design document, its</text>
<text x="1060" y="583" font-size="20" fill="#555">chapters of &lt;Policy&gt;,</text>
<text x="1060" y="612" font-size="20" fill="#555">&lt;Procedures&gt; and &lt;Control</text>
<text x="1060" y="641" font-size="20" fill="#555">Assessment Record&gt;</text>
<line x1="490" y1="255" x2="538" y2="255" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="982" y1="255" x2="1030" y2="255" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="1252.0" y1="372" x2="1252.0" y2="468" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="1030" y1="585" x2="982" y2="585" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="538" y1="585" x2="490" y2="585" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<path d="M268.0,702 L268.0,730 L1252.0,730 L1252.0,704" fill="none" stroke="#2f6fd6" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#a)"/>
<text x="760" y="722" font-size="19" fill="#555" text-anchor="middle">next family</text>
</svg></body></html>
