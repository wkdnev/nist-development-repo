<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#fff;font-family:Segoe UI,Arial,sans-serif}</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="800" viewBox="0 0 1520 800" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0L10,5L0,10z" fill="#999"/></marker><marker id="b" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0L0,5L10,10z" fill="#999"/></marker></defs>
<rect width="1520" height="800" fill="#fff"/>
<text x="48" y="55" font-size="30" font-weight="700" fill="#1a1a1a">Nobody is given access before they are trained</text>
<text x="48" y="92" font-size="21" fill="#555">Awareness, the briefing and the signed rules come first; role modules come before privileged access.</text>
<text x="48" y="150" font-size="24" font-weight="700" fill="#1a1a1a">Every user, before any access</text>
<rect x="48" y="172" width="320" height="186" rx="12" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="76" y="220" font-size="25" font-weight="700" fill="#1a1a1a">1 General course</text>
<text x="76" y="258" font-size="20" fill="#555">&lt;Organisation&gt;'s</text>
<text x="76" y="288" font-size="20" fill="#555">security and privacy</text>
<text x="76" y="318" font-size="20" fill="#555">awareness course</text>
<rect x="416" y="172" width="320" height="186" rx="12" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="444" y="220" font-size="25" font-weight="700" fill="#1a1a1a">2 Briefing</text>
<text x="444" y="258" font-size="20" fill="#555">20 minutes, from the</text>
<text x="444" y="288" font-size="20" fill="#555">system owner, with</text>
<text x="444" y="318" font-size="20" fill="#555">a 5-question check</text>
<rect x="784" y="172" width="320" height="186" rx="12" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="812" y="220" font-size="25" font-weight="700" fill="#1a1a1a">3 Rules signed</text>
<text x="812" y="258" font-size="20" fill="#555">rules of behaviour:</text>
<text x="812" y="288" font-size="20" fill="#555">Part A, and Part B</text>
<text x="812" y="318" font-size="20" fill="#555">if privileged</text>
<rect x="1152" y="172" width="320" height="186" rx="12" fill="#fff" stroke="#2e9e44" stroke-width="3"/>
<text x="1180" y="220" font-size="25" font-weight="700" fill="#1a1a1a">Access</text>
<text x="1180" y="258" font-size="20" fill="#555">the group's owner adds</text>
<text x="1180" y="288" font-size="20" fill="#555">the person to the</text>
<text x="1180" y="318" font-size="20" fill="#555">AD group</text>
<line x1="368" y1="265.0" x2="414" y2="265.0" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="736" y1="265.0" x2="782" y2="265.0" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="1104" y1="265.0" x2="1150" y2="265.0" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<text x="48" y="444" font-size="24" font-weight="700" fill="#1a1a1a">A privileged or security role, as well</text>
<rect x="48" y="466" width="504" height="160" rx="12" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="76" y="514" font-size="25" font-weight="700" fill="#1a1a1a">4 Role modules</text>
<text x="76" y="552" font-size="20" fill="#555">from M1 to M9, by role, each with</text>
<text x="76" y="582" font-size="20" fill="#555">a check: pass mark 80%</text>
<rect x="600" y="466" width="364" height="160" rx="12" fill="#fff" stroke="#2e9e44" stroke-width="3"/>
<text x="628" y="514" font-size="25" font-weight="700" fill="#1a1a1a">Privileged access</text>
<text x="628" y="552" font-size="20" fill="#555">the system owner checks</text>
<text x="628" y="582" font-size="20" fill="#555">the training register first</text>
<rect x="1012" y="466" width="460" height="160" rx="12" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="1040" y="514" font-size="25" font-weight="700" fill="#1a1a1a">5 Within 30 days</text>
<text x="1040" y="552" font-size="20" fill="#555">incident response (M7) and</text>
<text x="1040" y="582" font-size="20" fill="#555">contingency (M8)</text>
<line x1="552" y1="546.0" x2="598" y2="546.0" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="964" y1="546.0" x2="1010" y2="546.0" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="48" y="680" width="1424" height="80" rx="12" fill="#efeeeb" stroke="#999" stroke-width="2"/>
<text x="76" y="727" font-size="20" fill="#555">Every 12 months all of it is repeated. The security officer records each completion, kept for 3 years.</text>
</svg></body></html>
