<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#fff;font-family:Segoe UI,Arial,sans-serif}</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="842" viewBox="0 0 1520 842" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0L10,5L0,10z" fill="#999"/></marker></defs>
<rect width="1520" height="842" fill="#fff"/>
<text x="48" y="55" font-size="30" font-weight="700" fill="#1a1a1a">The life of personal data in the system</text>
<text x="48" y="92" font-size="21" fill="#555">HR documents hold personal data, some of it special category data.</text>
<rect x="48" y="130" width="424" height="210" rx="12" fill="#d9e1ec" stroke="#2f6fd6" stroke-width="3"/>
<text x="76" y="180" font-size="25" font-weight="700" fill="#1a1a1a">1 Lawful purpose</text>
<text x="76" y="222" font-size="20" fill="#555">HR administration or managing</text>
<text x="76" y="253" font-size="20" fill="#555">documents, with a recorded</text>
<text x="76" y="284" font-size="20" fill="#555">basis and condition</text>
<rect x="548" y="130" width="424" height="210" rx="12" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="576" y="180" font-size="25" font-weight="700" fill="#1a1a1a">2 Collected</text>
<text x="576" y="222" font-size="20" fill="#555">uploaded into an authorised</text>
<text x="576" y="253" font-size="20" fill="#555">schema; special category</text>
<text x="576" y="284" font-size="20" fill="#555">data only where allowed</text>
<rect x="1048" y="130" width="424" height="210" rx="12" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="1076" y="180" font-size="25" font-weight="700" fill="#1a1a1a">3 Limited</text>
<text x="1076" y="222" font-size="20" fill="#555">only the schema&#x27;s readers and</text>
<text x="1076" y="253" font-size="20" fill="#555">editors can find it, view it,</text>
<text x="1076" y="284" font-size="20" fill="#555">print it or export it</text>
<rect x="1048" y="420" width="424" height="210" rx="12" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="1076" y="470" font-size="25" font-weight="700" fill="#1a1a1a">4 Kept accurate</text>
<text x="1076" y="512" font-size="20" fill="#555">each schema checked</text>
<text x="1076" y="543" font-size="20" fill="#555">every 12 months; errors</text>
<text x="1076" y="574" font-size="20" fill="#555">corrected or deleted</text>
<rect x="548" y="420" width="424" height="210" rx="12" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="576" y="470" font-size="25" font-weight="700" fill="#1a1a1a">5 People&#x27;s rights</text>
<text x="576" y="512" font-size="20" fill="#555">see, correct or delete</text>
<text x="576" y="543" font-size="20" fill="#555">within a month; complaints</text>
<text x="576" y="574" font-size="20" fill="#555">acknowledged in 30 days</text>
<rect x="48" y="420" width="424" height="210" rx="12" fill="#fff" stroke="#2e9e44" stroke-width="3"/>
<text x="76" y="470" font-size="25" font-weight="700" fill="#1a1a1a">6 Disposed of</text>
<text x="76" y="512" font-size="20" fill="#555">at the end of its period;</text>
<text x="76" y="543" font-size="20" fill="#555">the deletion audited and</text>
<text x="76" y="574" font-size="20" fill="#555">no copy left behind</text>
<line x1="472" y1="235" x2="546" y2="235" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="972" y1="235" x2="1046" y2="235" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="1260" y1="340" x2="1260" y2="418" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="1048" y1="525" x2="974" y2="525" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="548" y1="525" x2="474" y2="525" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="48" y="690" width="1424" height="112" rx="12" fill="#efeeeb" stroke="#999" stroke-width="2"/>
<text x="76" y="734" font-size="20" fill="#555">The impact assessment is completed before production, and reviewed after any significant change.</text>
<text x="76" y="770" font-size="20" fill="#555">A personal data breach goes to the legal adviser at once, and to the ICO within 72 hours if it must be reported.</text>
</svg></body></html>
