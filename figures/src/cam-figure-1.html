<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#fff;font-family:Segoe UI,Arial,sans-serif}</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="796" viewBox="0 0 1520 796" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0L10,5L0,10z" fill="#999"/></marker><marker id="b" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0L0,5L10,10z" fill="#999"/></marker></defs>
<rect width="1520" height="796" fill="#fff"/>
<text x="48" y="55" font-size="30" font-weight="700" fill="#1a1a1a">Assess, authorise, monitor, and round again</text>
<text x="48" y="92" font-size="21" fill="#555">The cycle repeats every 12 months, and sooner after a significant change.</text>
<rect x="48" y="140" width="432" height="196" rx="12" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="76" y="188" font-size="25" font-weight="700" fill="#1a1a1a">1 Plan</text>
<text x="76" y="226" font-size="20" fill="#555">the system owner and assessor</text>
<text x="76" y="256" font-size="20" fill="#555">agree the plan; the authorising</text>
<text x="76" y="286" font-size="20" fill="#555">official approves it</text>
<rect x="544" y="140" width="432" height="196" rx="12" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="572" y="188" font-size="25" font-weight="700" fill="#1a1a1a">2 Assess</text>
<text x="572" y="226" font-size="20" fill="#555">Level 1 by the system owner,</text>
<text x="572" y="256" font-size="20" fill="#555">Level 2 by an independent team</text>
<rect x="1040" y="140" width="432" height="196" rx="12" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="1068" y="188" font-size="25" font-weight="700" fill="#1a1a1a">3 Report</text>
<text x="1068" y="226" font-size="20" fill="#555">the assessment report goes to</text>
<text x="1068" y="256" font-size="20" fill="#555">the system owner, authorising</text>
<text x="1068" y="286" font-size="20" fill="#555">official and Head of Cyber</text>
<rect x="1040" y="420" width="432" height="196" rx="12" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="1068" y="468" font-size="25" font-weight="700" fill="#1a1a1a">4 Track each weakness</text>
<text x="1068" y="506" font-size="20" fill="#555">rated in the Risk List; fixes in</text>
<text x="1068" y="536" font-size="20" fill="#555">the plan of action, updated</text>
<text x="1068" y="566" font-size="20" fill="#555">every month</text>
<rect x="544" y="420" width="432" height="196" rx="12" fill="#fff" stroke="#2e9e44" stroke-width="3"/>
<text x="572" y="468" font-size="25" font-weight="700" fill="#1a1a1a">5 Authorise</text>
<text x="572" y="506" font-size="20" fill="#555">the authorising official accepts</text>
<text x="572" y="536" font-size="20" fill="#555">the remaining risk by name,</text>
<text x="572" y="566" font-size="20" fill="#555">for up to 12 months</text>
<rect x="48" y="420" width="432" height="196" rx="12" fill="#fff" stroke="#2f6fd6" stroke-width="3"/>
<text x="76" y="468" font-size="25" font-weight="700" fill="#1a1a1a">6 Monitor</text>
<text x="76" y="506" font-size="20" fill="#555">measures every month; a report</text>
<text x="76" y="536" font-size="20" fill="#555">to the authorising official</text>
<text x="76" y="566" font-size="20" fill="#555">every quarter</text>
<line x1="480" y1="238.0" x2="542" y2="238.0" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="976" y1="238.0" x2="1038" y2="238.0" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="1256.0" y1="336" x2="1256.0" y2="418" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="1040" y1="518.0" x2="978" y2="518.0" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="544" y1="518.0" x2="482" y2="518.0" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="264.0" y1="420" x2="264.0" y2="338" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="48" y="676" width="1424" height="80" rx="12" fill="#efeeeb" stroke="#999" stroke-width="2"/>
<text x="76" y="723" font-size="20" fill="#555">Level 1 is the system owner's self-assessment. Level 2 is an independent assessment before authorisation.</text>
</svg></body></html>
