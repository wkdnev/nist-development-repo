<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#fff;font-family:Segoe UI,Arial,sans-serif}</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="820" viewBox="0 0 1520 820" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0L10,5L0,10z" fill="#999"/></marker></defs>
<rect width="1520" height="820" fill="#fff"/>
<text x="48" y="55" font-size="30" font-weight="700" fill="#1a1a1a">Where &lt;System Name&gt; is, and who protects each place</text>
<text x="48" y="92" font-size="21" fill="#555">&lt;System Name&gt; has no premises of its own. Fifteen of the 18 controls are provided by &lt;Organisation&gt;.</text>
<rect x="48" y="145" width="690" height="224" rx="12" fill="#fff" stroke="#2f6fd6" stroke-width="3"/>
<text x="76" y="193" font-size="25" font-weight="700" fill="#1a1a1a">Data centre</text>
<text x="76" y="231" font-size="20" fill="#555">Hosts both servers.</text>
<text x="76" y="263" font-size="20" fill="#555">&lt;Organisation&gt; controls entry, monitoring,</text>
<text x="76" y="295" font-size="20" fill="#555">power, fire, environment and water.</text>
<rect x="782" y="145" width="690" height="224" rx="12" fill="#fff" stroke="#2f6fd6" stroke-width="3"/>
<text x="810" y="193" font-size="25" font-weight="700" fill="#1a1a1a">Second site</text>
<text x="810" y="231" font-size="20" fill="#555">Holds the backups, and is used for recovery.</text>
<text x="810" y="263" font-size="20" fill="#555">&lt;Organisation&gt; protects it to the same</text>
<text x="810" y="295" font-size="20" fill="#555">requirements as the data centre.</text>
<rect x="48" y="409" width="690" height="224" rx="12" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="76" y="457" font-size="25" font-weight="700" fill="#1a1a1a">Offices</text>
<text x="76" y="495" font-size="20" fill="#555">Where &lt;System Name&gt; is used and printed.</text>
<text x="76" y="527" font-size="20" fill="#555">Managed printers with secure release;</text>
<text x="76" y="559" font-size="20" fill="#555">screens locked by the device and out of view.</text>
<rect x="782" y="409" width="690" height="224" rx="12" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="810" y="457" font-size="25" font-weight="700" fill="#1a1a1a">Homes</text>
<text x="810" y="495" font-size="20" fill="#555">Remote working, on a managed device and route.</text>
<text x="810" y="527" font-size="20" fill="#555">No printing unless approved; the controls are</text>
<text x="810" y="559" font-size="20" fill="#555">checked every 12 months.</text>
<rect x="48" y="673" width="1424" height="100" rx="12" fill="#efeeeb" stroke="#999" stroke-width="2"/>
<text x="76" y="715" font-size="20" fill="#555">A physical control counts only once &lt;Organisation&gt; has evidenced it.</text>
<text x="76" y="751" font-size="20" fill="#555">The server disks and the backups are encrypted, so that reaching a host does not expose the items.</text>
</svg></body></html>
