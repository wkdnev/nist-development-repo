<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#fff;font-family:Segoe UI,Arial,sans-serif}</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="830" viewBox="0 0 1520 830" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0L10,5L0,10z" fill="#999"/></marker></defs>
<rect width="1520" height="830" fill="#fff"/>
<text x="48" y="55" font-size="30" font-weight="700" fill="#1a1a1a">How a maintenance job is controlled</text>
<text x="48" y="92" font-size="21" fill="#555">Every job, from the change record to the monthly review of the maintenance records.</text>
<rect x="48" y="150" width="432" height="192" rx="12" fill="#fff" stroke="#2f6fd6" stroke-width="3"/>
<text x="76" y="198" font-size="25" font-weight="700" fill="#1a1a1a">1 Plan and approve</text>
<text x="76" y="236" font-size="20" fill="#555">a change record, approved</text>
<text x="76" y="267" font-size="20" fill="#555">before the work starts</text>
<rect x="544" y="150" width="432" height="192" rx="12" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="572" y="198" font-size="25" font-weight="700" fill="#1a1a1a">2 Give notice</text>
<text x="572" y="236" font-size="20" fill="#555">2 working days ahead, if the</text>
<text x="572" y="267" font-size="20" fill="#555">work affects users</text>
<rect x="1040" y="150" width="432" height="192" rx="12" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="1068" y="198" font-size="25" font-weight="700" fill="#1a1a1a">3 Do the work</text>
<text x="1068" y="236" font-size="20" fill="#555">approved people, tools and</text>
<text x="1068" y="267" font-size="20" fill="#555">routes only; anyone else</text>
<text x="1068" y="298" font-size="20" fill="#555">is escorted</text>
<rect x="1040" y="430" width="432" height="192" rx="12" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="1068" y="478" font-size="25" font-weight="700" fill="#1a1a1a">4 Check afterwards</text>
<text x="1068" y="516" font-size="20" fill="#555">nine checks; the security</text>
<text x="1068" y="547" font-size="20" fill="#555">officer signs the result</text>
<text x="1068" y="578" font-size="20" fill="#555">within 1 working day</text>
<rect x="544" y="430" width="432" height="192" rx="12" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="572" y="478" font-size="25" font-weight="700" fill="#1a1a1a">5 Record</text>
<text x="572" y="516" font-size="20" fill="#555">who, what, when, the tools,</text>
<text x="572" y="547" font-size="20" fill="#555">the route and the remote</text>
<text x="572" y="578" font-size="20" fill="#555">connection reference</text>
<rect x="48" y="430" width="432" height="192" rx="12" fill="#fff" stroke="#2e9e44" stroke-width="3"/>
<text x="76" y="478" font-size="25" font-weight="700" fill="#1a1a1a">6 Review</text>
<text x="76" y="516" font-size="20" fill="#555">each month, against the</text>
<text x="76" y="547" font-size="20" fill="#555">change records; none found</text>
<text x="76" y="578" font-size="20" fill="#555">means an incident</text>
<line x1="480" y1="246" x2="542" y2="246" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="976" y1="246" x2="1038" y2="246" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="1256" y1="342" x2="1256" y2="428" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="1040" y1="526" x2="978" y2="526" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="544" y1="526" x2="482" y2="526" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="48" y="680" width="1424" height="100" rx="12" fill="#efeeeb" stroke="#999" stroke-width="2"/>
<text x="76" y="722" font-size="20" fill="#555">Emergency work follows the emergency change rule and is recorded within 1 working day.</text>
<text x="76" y="758" font-size="20" fill="#555">Nothing leaves with &lt;System Name&gt;'s information on it unless the system owner approves it.</text>
</svg></body></html>
