<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#fff}</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="700" viewBox="0 0 1520 700" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0L10,5L0,10z" fill="#999"/></marker></defs>
<rect width="1520" height="700" fill="#fff"/>
<text x="48" y="55" font-size="30" font-weight="700" fill="#1a1a1a">The documents answer four questions in turn</text>
<text x="48" y="92" font-size="21" fill="#555">Each fact is written once, in one document. The others point to it.</text>
<rect x="48" y="140" width="320" height="300" rx="12" fill="#fff" stroke="#2f6fd6" stroke-width="3"/>
<text x="76" y="186" font-size="25" font-weight="700" fill="#1a1a1a">Plans and</text>
<text x="76" y="218" font-size="25" font-weight="700" fill="#1a1a1a">descriptions</text>
<text x="76" y="266" font-size="20" font-weight="700" fill="#555">22 documents</text>
<text x="76" y="312" font-size="20" fill="#555">What is &lt;System Name&gt;,</text>
<text x="76" y="341" font-size="20" fill="#555">and how is each family</text>
<text x="76" y="370" font-size="20" fill="#555">of controls designed?</text>
<line x1="370" y1="290.0" x2="414" y2="290.0" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="416" y="140" width="320" height="300" rx="12" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="444" y="186" font-size="25" font-weight="700" fill="#1a1a1a">Rules and how they</text>
<text x="444" y="218" font-size="25" font-weight="700" fill="#1a1a1a">are carried out</text>
<text x="444" y="266" font-size="20" font-weight="700" fill="#555">11 documents</text>
<text x="444" y="312" font-size="20" fill="#555">What must be true,</text>
<text x="444" y="341" font-size="20" fill="#555">who does what, and</text>
<text x="444" y="370" font-size="20" fill="#555">what record proves it?</text>
<line x1="738" y1="290.0" x2="782" y2="290.0" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="784" y="140" width="320" height="300" rx="12" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="812" y="186" font-size="25" font-weight="700" fill="#1a1a1a">Assessment and</text>
<text x="812" y="218" font-size="25" font-weight="700" fill="#1a1a1a">authorisation</text>
<text x="812" y="266" font-size="20" font-weight="700" fill="#555">7 documents</text>
<text x="812" y="312" font-size="20" fill="#555">How well is each control</text>
<text x="812" y="341" font-size="20" fill="#555">met, what is the risk,</text>
<text x="812" y="370" font-size="20" fill="#555">and what is being done?</text>
<line x1="1106" y1="290.0" x2="1150" y2="290.0" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="1152" y="140" width="320" height="300" rx="12" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="1180" y="186" font-size="25" font-weight="700" fill="#1a1a1a">Guides and</text>
<text x="1180" y="218" font-size="25" font-weight="700" fill="#1a1a1a">index</text>
<text x="1180" y="266" font-size="20" font-weight="700" fill="#555">4 documents</text>
<text x="1180" y="312" font-size="20" fill="#555">Where is everything?</text>
<text x="1180" y="341" font-size="20" fill="#555">Start with &lt;Guide to the</text>
<text x="1180" y="370" font-size="20" fill="#555">Document Set&gt;</text>
<rect x="48" y="490" width="1424" height="170" rx="12" fill="#efeeeb" stroke="#999" stroke-width="2"/>
<text x="76" y="532" font-size="20" fill="#555">&lt;System Description&gt; sets the reference design that every family document is checked against.</text>
<text x="76" y="564" font-size="20" fill="#555">Each of the families has one design document that takes every control part by part.</text>
<text x="76" y="596" font-size="20" fill="#555">&lt;System Security Plan&gt; has one line for each control. Every gap has an entry in &lt;Risk List&gt;,</text>
<text x="76" y="628" font-size="20" fill="#555">and every weakness that needs a fix has an item in &lt;Plan of Action and Milestones&gt;.</text>
</svg></body></html>
