<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#fff;font-family:Segoe UI,Arial,sans-serif}</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="800" viewBox="0 0 1520 800" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0L10,5L0,10z" fill="#999"/></marker></defs>
<rect width="1520" height="800" fill="#fff"/>
<text x="48" y="55" font-size="30" font-weight="700" fill="#1a1a1a">Two decisions before any access, and nobody decides their own request</text>
<text x="48" y="92" font-size="21" fill="#555">ServiceNow keeps the record of every step.</text>
<text x="48" y="152" font-size="24" font-weight="700" fill="#1a1a1a">Access to a schema, or a privileged role</text>
<rect x="48" y="172" width="320" height="200" rx="12" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="76" y="218" font-size="25" font-weight="700" fill="#1a1a1a">1 The person</text>
<text x="76" y="256" font-size="20" fill="#555">raises the request</text>
<text x="76" y="286" font-size="20" fill="#555">in ServiceNow, with</text>
<text x="76" y="316" font-size="20" fill="#555">the reason</text>
<rect x="416" y="172" width="320" height="200" rx="12" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="444" y="218" font-size="25" font-weight="700" fill="#1a1a1a">2 Line manager</text>
<text x="444" y="256" font-size="20" fill="#555">approves: the</text>
<text x="444" y="286" font-size="20" fill="#555">person needs it</text>
<text x="444" y="316" font-size="20" fill="#555">for their work</text>
<rect x="784" y="172" width="320" height="200" rx="12" fill="#fff" stroke="#2f6fd6" stroke-width="3"/>
<text x="812" y="218" font-size="25" font-weight="700" fill="#1a1a1a">3 Owner</text>
<text x="812" y="256" font-size="20" fill="#555">authorises: the</text>
<text x="812" y="286" font-size="20" fill="#555">schema's Data Owner,</text>
<text x="812" y="316" font-size="20" fill="#555">or the system owner</text>
<text x="812" y="346" font-size="20" fill="#555">for a role</text>
<rect x="1152" y="172" width="320" height="200" rx="12" fill="#fff" stroke="#2e9e44" stroke-width="3"/>
<text x="1180" y="218" font-size="25" font-weight="700" fill="#1a1a1a">4 Carried out</text>
<text x="1180" y="256" font-size="20" fill="#555">the same owner adds</text>
<text x="1180" y="286" font-size="20" fill="#555">the person to the</text>
<text x="1180" y="316" font-size="20" fill="#555">AD group</text>
<line x1="368" y1="272" x2="414" y2="272" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="736" y1="272" x2="782" y2="272" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="1104" y1="272" x2="1150" y2="272" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<text x="48" y="460" font-size="24" font-weight="700" fill="#1a1a1a">A leaver</text>
<rect x="48" y="480" width="472" height="170" rx="12" fill="#fff" stroke="#999" stroke-width="2" stroke-dasharray="8 6"/>
<text x="76" y="526" font-size="25" font-weight="700" fill="#1a1a1a">Starters/Leavers system</text>
<text x="76" y="564" font-size="20" fill="#555">raises the request by itself;</text>
<text x="76" y="594" font-size="20" fill="#555">&lt;Organisation&gt; disables the</text>
<text x="76" y="624" font-size="20" fill="#555">AD account at once</text>
<rect x="584" y="480" width="888" height="170" rx="12" fill="#fff" stroke="#999" stroke-width="2"/>
<text x="612" y="526" font-size="25" font-weight="700" fill="#1a1a1a">Group owners</text>
<text x="612" y="564" font-size="20" fill="#555">remove the memberships within 5 working days. For a high-risk</text>
<text x="612" y="594" font-size="20" fill="#555">individual, &lt;Organisation&gt; disables the AD account and ends</text>
<text x="612" y="624" font-size="20" fill="#555">the PingFederate sign-in within 1 hour</text>
<line x1="520" y1="565" x2="582" y2="565" stroke="#999" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="48" y="690" width="1424" height="72" rx="12" fill="#efeeeb" stroke="#999" stroke-width="2"/>
<text x="76" y="734" font-size="20" fill="#555">The closed ServiceNow request is the record of the decision, kept for 3 years.</text>
</svg></body></html>
