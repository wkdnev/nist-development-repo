<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#fff;font-family:Segoe UI,Arial,sans-serif}</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="860" viewBox="0 0 1520 860" font-family="Segoe UI, Arial, sans-serif">
<rect width="1520" height="860" fill="#fff"/>
<text x="48" y="55" font-size="30" font-weight="700" fill="#1a1a1a">Access control is shared between &lt;System Name&gt;, &lt;Organisation&gt; and people</text>
<text x="48" y="92" font-size="21" fill="#555">The &lt;System Name&gt; team has no control over the right-hand column. Its evidence must come from &lt;Organisation&gt;.</text>
<rect x="48" y="128" width="690" height="420" rx="12" fill="#fff" stroke="#2f6fd6" stroke-width="3"/>
<text x="80" y="176" font-size="25" font-weight="700" fill="#1a1a1a">&lt;System Name&gt; enforces</text>
<text x="80" y="222" font-size="20" fill="#555">Roles and schema access, from AD groups</text>
<text x="80" y="256" font-size="20" fill="#555">Which AD groups open each schema</text>
<text x="80" y="290" font-size="20" fill="#555">Actions allowed without signing in</text>
<text x="80" y="324" font-size="20" fill="#555">Audit of account and privileged actions (partly built)</text>
<text x="80" y="358" font-size="20" fill="#555">System use notice (not built)</text>
<text x="80" y="392" font-size="20" fill="#555">Only the API reaches the database</text>
<rect x="782" y="128" width="690" height="420" rx="12" fill="#fff" stroke="#999" stroke-width="2" stroke-dasharray="8 6"/>
<text x="814" y="176" font-size="25" font-weight="700" fill="#1a1a1a">&lt;Organisation&gt; provides (inherited)</text>
<text x="814" y="222" font-size="20" fill="#555">Sign-in: PingFederate, with MFA, and its lifetime</text>
<text x="814" y="256" font-size="20" fill="#555">Accounts and groups: Active Directory</text>
<text x="814" y="290" font-size="20" fill="#555">Every firewall rule</text>
<text x="814" y="324" font-size="20" fill="#555">Remote access: VPN, one gateway, monitored</text>
<text x="814" y="358" font-size="20" fill="#555">Lockout, logon banner and screen lock</text>
<text x="814" y="392" font-size="20" fill="#555">Wireless network</text>
<text x="814" y="426" font-size="20" fill="#555">Device controls: USB, unmanaged devices, phones</text>
<text x="814" y="460" font-size="20" fill="#555">ServiceNow and the Starters/Leavers system</text>
<rect x="48" y="584" width="1424" height="246" rx="12" fill="#efeeeb" stroke="#999" stroke-width="2"/>
<text x="80" y="632" font-size="25" font-weight="700" fill="#1a1a1a">People, following the procedures</text>
<text x="80" y="678" font-size="20" fill="#555">Approving and authorising each access request</text>
<text x="80" y="712" font-size="20" fill="#555">Reviewing access, every 3 or 12 months</text>
<text x="80" y="746" font-size="20" fill="#555">Acting on leavers, movers and high-risk individuals</text>
<text x="80" y="780" font-size="20" fill="#555">Building the ServiceNow workflow: Application Support Team</text>
<text x="814" y="678" font-size="20" fill="#555">Data Owners deciding what may leave a schema</text>
<text x="814" y="712" font-size="20" fill="#555">Approving exceptions, each with an end date</text>
<text x="814" y="746" font-size="20" fill="#555">Administrators using a separate everyday account</text>
<text x="814" y="780" font-size="20" fill="#555">Group owners managing the members of AD groups</text>
</svg></body></html>
